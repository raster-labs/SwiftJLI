name: Codec and contract

# Contract 0.5.0 PLAT-01: Swift 6.2 is the manifest minimum and Swift 6.4 the
# qualified primary toolchain, so both are built and tested here. A gate that
# cannot run is an unexecuted gate, not a pass (POL-08), so every job below uses
# a generally available image or runner. No OS 27 job exists because no stable
# runner ships those SDKs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-identity:
    name: Shared contract byte-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # POL-03 requires the seven shared documents to stay byte-identical across
      # all four repositories. Checking the recorded manifest here catches local
      # drift immediately; cross-repository comparison belongs to the suite
      # harness, which cannot run from inside one repository.
      - name: Verify COMMON_CONTRACT_SHA256.txt matches the documents
        working-directory: Documentation
        run: sha256sum -c COMMON_CONTRACT_SHA256.txt

  linux:
    name: Swift ${{ matrix.swift }} / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.2', '6.4']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift build -c release
      - run: swift test -c release

      - name: CLI and staged manual installation
        if: matrix.swift == '6.4'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 man-db mandoc
          # The minimised Swift image diverts man to a message-only stub.
          if [ -x /usr/bin/man.REAL ]; then ln -s /usr/bin/man.REAL /usr/local/bin/man; fi
          python3 Scripts/test-cli.py --binary "$PWD/.build/release/swiftjli-cli" --output "$RUNNER_TEMP/cli-evidence"

  macos:
    name: macOS 26 / Xcode default Swift
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: xcodebuild -version
      - run: swift build
      - run: swift test
      - run: swift build -c release
      - run: swift test -c release
      - name: Address sanitizer
        run: swift test --scratch-path .build/asan --sanitize address
      - name: Thread sanitizer
        run: swift test --scratch-path .build/tsan --sanitize thread

  apple-sdk-builds:
    name: Apple device, simulator and Intel SDK compilation
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile SwiftJLI for the required Apple SDKs
        run: bash Scripts/build-apple-sdks.sh

  macos-intel:
    name: Native macOS 26 Intel runtime and CLI
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record native host and compiler
        run: |
          test "$(uname -m)" = x86_64
          sw_vers
          swift --version
          xcodebuild -version
      - run: swift test -j 3
      - run: swift test -c release -j 3
      - name: Qualify CLI installation and manual
        run: |
          command -v mandoc >/dev/null || brew install mandoc
          python3 Scripts/test-cli.py --binary "$PWD/.build/release/swiftjli-cli" --output "$RUNNER_TEMP/cli-intel"

  ios-simulator:
    name: iOS 26+ simulator runtime
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run library tests on an installed simulator
        run: python3 Scripts/test-apple-simulator.py --output "$RUNNER_TEMP/ios-runtime"
      - name: Compare the actual predecessor on the same simulator
        run: python3 Scripts/test-apple-simulator.py --package-path Examples/PredecessorComparison --scheme PredecessorComparison --output "$RUNNER_TEMP/ios-predecessor"
      - name: Retain simulator commands and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-runtime-evidence
          path: |
            ${{ runner.temp }}/ios-runtime/*.json
            ${{ runner.temp }}/ios-runtime/*.log
            ${{ runner.temp }}/ios-runtime/Tests.xcresult
            ${{ runner.temp }}/ios-predecessor/*.json
            ${{ runner.temp }}/ios-predecessor/*.log
            ${{ runner.temp }}/ios-predecessor/Tests.xcresult
          retention-days: 14

  other-apple-simulators:
    name: ${{ matrix.platform }} 26+ simulator runtime
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS, visionOS, watchOS]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run the library suite on the target simulator
        run: python3 Scripts/test-apple-simulator.py --platform "${{ matrix.platform }}" --output "$RUNNER_TEMP/runtime"
      - name: Retain simulator commands and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}-runtime-evidence
          path: |
            ${{ runner.temp }}/runtime/*.json
            ${{ runner.temp }}/runtime/*.log
            ${{ runner.temp }}/runtime/Tests.xcresult
          retention-days: 14

  independent-consumer:
    name: Independent consumer resolves at tools 6.2
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: package
      # POL-01/POL-02: a consumer must build against this package alone, with no
      # sibling checkout and no suite dependency, on the declared manifest floor.
      - name: Build a fresh consumer against the checkout
        run: |
          set -eux
          NAME="$(grep -m1 -oE 'name: "Swift[A-Z0-9]+"' "$GITHUB_WORKSPACE/package/Package.swift" \
                  | grep -oE 'Swift[A-Z0-9]+')"
          mkdir -p /tmp/consumer/Sources/Consumer
          cd /tmp/consumer
          {
            echo '// swift-tools-version: 6.2'
            echo 'import PackageDescription'
            echo 'let package = Package('
            echo '    name: "Consumer",'
            echo "    dependencies: [.package(path: \"$GITHUB_WORKSPACE/package\")],"
            echo '    targets: [.executableTarget(name: "Consumer", dependencies: ['
            echo "        .product(name: \"$NAME\", package: \"package\")])]"
            echo ')'
          } > Package.swift
          cp "$GITHUB_WORKSPACE/package/Examples/IndependentConsumer/Sources/IndependentConsumer/main.swift" Sources/Consumer/main.swift
          swift build
          swift run Consumer
